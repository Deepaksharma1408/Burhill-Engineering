  <line x1="16" y1="21" x2="16" y2="31" stroke="#B58A43" stroke-width="1.5"/>
  <line x1="48" y1="21" x2="48" y2="31" stroke="#B58A43" stroke-width="1.5"/>

  <!-- BEP Monogram Stamp -->
