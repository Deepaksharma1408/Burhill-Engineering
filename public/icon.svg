<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep Navy Background with Gold Engineering Border -->
  <rect width="64" height="64" rx="14" fill="#0D1424"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#B58A43" stroke-width="2.5"/>
  <rect x="5" y="5" width="54" height="54" rx="9" stroke="#1F2E4F" stroke-width="1"/>

  <!-- Isometric Blueprint Beam Accent -->
